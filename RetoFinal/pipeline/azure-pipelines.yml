
trigger:
  branches:
    include:
      - reto-practico-modulo5
  paths:
    include:
      - RetoFinal/**

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: Instalar
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
            displayName: Instalar Node.js

          - script: npm ci
            workingDirectory: RetoFinal/app-tienda
            displayName: Instalar dependencias y generar datos

  - stage: SmokeTests
    displayName: SmokeTests
    dependsOn: Build
    jobs:
      - job: Smoke
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'

          - script: |
              npm ci
              npm start > tienda.log 2>&1 &
              echo $! > tienda.pid
            workingDirectory: RetoFinal/app-tienda
            displayName: Iniciar tienda

          - script: |
              for i in $(seq 1 30); do
                if curl -fsS http://localhost:3000/api/health; then
                  echo "Tienda lista"
                  exit 0
                fi
                sleep 2
              done
              echo "ERROR: La tienda no inicio"
              exit 1
            displayName: Esperar Health Check
          - script: node pipeline/scripts/smoke-tests.js
            workingDirectory: RetoFinal
            displayName: Ejecutar pruebas Smoke

  - stage: LoadTest
    displayName: LoadTest
    dependsOn: SmokeTests
    jobs:
      - job: Carga
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'

          - script: |
              npm ci
              npm start > tienda.log 2>&1 &
            workingDirectory: RetoFinal/app-tienda
            displayName: Iniciar tienda

          - script: |
              sudo apt-get update
              sudo apt-get install -y gnupg ca-certificates
              sudo gpg -k
              sudo mkdir -p /etc/apt/keyrings
              curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/k6-archive-keyring.gpg
              echo "deb [signed-by=/etc/apt/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
              sudo apt-get update
              sudo apt-get install -y k6
            displayName: Instalar k6

          - script: |
              for i in $(seq 1 30); do
                if curl -fsS http://localhost:3000/api/health; then
                  echo "Tienda lista"
                  exit 0
                fi
                sleep 2
              done
              echo "ERROR: La tienda no inicio"
              exit 1
            displayName: Esperar Health Check
          - script: k6 run pipeline/scripts/load-test.js
            workingDirectory: RetoFinal
            displayName: Quality Gate de carga

  - stage: E2ETests
    displayName: Pruebas E2E BDD
    dependsOn: LoadTest
    jobs:
      - job: EjecutarBDD
        displayName: Playwright + Screenplay + pytest-bdd
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
            displayName: Configurar Python 3.11

          - script: |
              python -m pip install -r e2e/requirements.txt
              python -m playwright install --with-deps chromium
            workingDirectory: RetoFinal
            displayName: Instalar dependencias E2E

          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
            displayName: Configurar Node.js

          - script: |
              npm ci
              npm start > tienda.log 2>&1 &
            workingDirectory: RetoFinal/app-tienda
            displayName: Iniciar tienda

          - script: |
              for i in $(seq 1 30); do
                if curl -fsS http://localhost:3000/api/health; then
                  echo "Tienda lista"
                  exit 0
                fi
                sleep 2
              done
              echo "ERROR: La tienda no inicio"
              exit 1
            displayName: Esperar tienda

          - script: |
              mkdir -p e2e/resultados
              python -m pytest e2e -v --junitxml=e2e/resultados/junit.xml
            workingDirectory: RetoFinal
            displayName: Ejecutar escenarios BDD

          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: 'RetoFinal/e2e/resultados/junit.xml'
              testRunTitle: 'Reto Final - Pruebas BDD Playwright'
              failTaskOnFailedTests: true
            displayName: Publicar resultados JUnit

  - stage: SauceLabs
    displayName: Prueba remota Sauce Labs
    dependsOn: E2ETests
    jobs:
      - job: EjecutarSauceLabs
        displayName: Selenium + Sauce Connect
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
            displayName: Configurar Python

          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
            displayName: Configurar Node.js

          - script: |
              set -e
              python -m pip install selenium==4.52.0
              npm ci
              npm start > tienda.log 2>&1 &
            workingDirectory: RetoFinal/app-tienda
            displayName: Instalar dependencias e iniciar Tienda QA

          - script: |
              for i in $(seq 1 30); do
                if curl -fsS http://127.0.0.1:3000/api/health; then
                  echo "Tienda QA lista"
                  exit 0
                fi
                sleep 2
              done
              echo "ERROR: Tienda QA no responde"
              exit 1
            displayName: Esperar Tienda QA

          - script: |
              set -e
              curl -fL -o sauce-connect.deb https://saucelabs.com/downloads/sauce-connect/5.5.4/sauce-connect_5.5.4.linux_amd64.deb
              sudo dpkg -i sauce-connect.deb
              /usr/bin/sc version
            workingDirectory: RetoFinal
            displayName: Instalar Sauce Connect

          - script: |
              set -e

              export SAUCE_TUNNEL_NAME="reto-final-${BUILD_BUILDID}"

              echo "Iniciando tunel: ${SAUCE_TUNNEL_NAME}"

              /usr/bin/sc run \
                --region us-west \
                --tunnel-name "${SAUCE_TUNNEL_NAME}" \
                --proxy-localhost allow \
                --api-address 127.0.0.1:8032 \
                > sauce-connect.log 2>&1 &

              SC_PID=$!

              trap 'kill "$SC_PID" 2>/dev/null || true' EXIT

              echo "Esperando disponibilidad real del tunel..."
              READY=0

              for i in $(seq 1 90); do
                if ! kill -0 "$SC_PID" 2>/dev/null; then
                  echo "ERROR: Sauce Connect termino inesperadamente"
                  tail -n 40 sauce-connect.log
                  exit 1
                fi

                HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8032/readyz || true)

                if [ "$HTTP_CODE" = "200" ]; then
                  READY=1
                  break
                fi

                sleep 2
              done

              if [ "$READY" -ne 1 ]; then
                echo "ERROR: El tunel no alcanzo estado READY"
                tail -n 40 sauce-connect.log
                exit 1
              fi

              echo "Tunel READY. Verificando registro en Sauce Labs..."

              python - <<'PY'
              import json
              import os
              import time
              import urllib.request
              from urllib.parse import quote

              user = os.environ["SAUCE_USERNAME"]
              key = os.environ["SAUCE_ACCESS_KEY"]
              name = os.environ["SAUCE_TUNNEL_NAME"]

              import base64
              token = base64.b64encode(f"{user}:{key}".encode()).decode()
              url = (
                  "https://api.us-west-1.saucelabs.com/rest/v1/"
                  + quote(user, safe="")
                  + "/tunnels?full=true"
              )

              found = False
              for attempt in range(30):
                  req = urllib.request.Request(
                      url,
                      headers={"Authorization": f"Basic {token}"}
                  )
                  with urllib.request.urlopen(req, timeout=15) as response:
                      tunnels = json.load(response)

                  for tunnel in tunnels:
                      if tunnel.get("tunnel_identifier") == name and tunnel.get("is_ready") is True:
                          found = True
                          break

                  if found:
                      print(f"Tunel registrado y listo: {name}")
                      break

                  time.sleep(2)

              if not found:
                  raise SystemExit(
                      f"ERROR: Sauce Labs no confirma el tunel {name} como disponible"
                  )
              PY

              echo "Ejecutando Selenium..."
              python cloud/sauce_remote_smoke.py

              echo "Prueba remota Selenium finalizada correctamente"

            workingDirectory: RetoFinal
            displayName: Sauce Connect + Selenium
            env:
              SAUCE_USERNAME: $(SAUCE_USERNAME)
              SAUCE_ACCESS_KEY: $(SAUCE_ACCESS_KEY)
